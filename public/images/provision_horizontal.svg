  <path d="M555 235 C590 185 630 145 675 105" class="gold" stroke-width="7" stroke-linecap="round"/>

  <ellipse cx="575" cy="205" rx="16" ry="42" transform="rotate(-28 575 205)" class="gold" stroke-width="5"/>
  <ellipse cx="607" cy="175" rx="16" ry="42" transform="rotate(-18 607 175)" class="gold" stroke-width="5"/>
  <ellipse cx="640" cy="145" rx="16" ry="42" transform="rotate(-8 640 145)" class="gold" stroke-width="5"/>
  <ellipse cx="655" cy="180" rx="16" ry="42" transform="rotate(38 655 180)" class="gold" stroke-width="5"/>

